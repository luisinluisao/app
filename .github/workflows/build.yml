name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Testes
        run: dotnet test tests/PcOptimizer.Core.Tests -c Release

      - name: Gerar executável
        run: >
          dotnet publish src/PcOptimizer.App -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -o publish

      - uses: actions/upload-artifact@v4
        with:
          name: PcOptimizer-win-x64
          path: publish/PcOptimizer.exe
